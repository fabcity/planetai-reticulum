name: test
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_peers.py
      - run: python3 -m py_compile reticulum_bridge.py
      - run: docker build -t planetai-reticulum .
